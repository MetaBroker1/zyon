<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2JXDKZW"

    <header class="curso-header">
        <img src="../../images/logo.png" alt="Zyon Capital" class="logo">
    </header>

    <main class="curso-container">
        <div class="curso-bonus-aviso">
            Complete os 3 passos e ganhe um <span class="bonus-destaque">bônus exclusivo</span> para começar a operar
        </div>

        <div class="curso-progress">
            <div class="step active">1</div>
            <div class="step-line"></div>
            <div class="step">2</div>
            <div class="step-line"></div>
            <div class="step">3</div>
        </div>

        <h1 class="curso-titulo">Passo 1 — Criando Conta, Interface e o que são Opções Binárias</h1>
        <p class="curso-subtitulo">Assista a aula completa para avançar ao próximo passo.</p>

        <div class="video-wrapper">
            <video id="videoAula" controls playsinline preload="auto"
                   autoplay muted poster="../../images/logo.png">
                <source src="../aula-1-criando-conta.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
        </div>

        <div id="btnContainer" class="btn-container hidden">
            <a href="../aula-2/" class="btn-proximo" id="btnProximo">
                Ir para o Passo 2 →
            </a>
        </div>

        <p id="msgAssista" class="msg-assistir">Assista a aula para desbloquear o próximo passo.</p>
    </main>

    <footer class="curso-footer">
        <p>Zyon Capital</p>
    </footer>

    <script>
    (function() {
        var video = document.getElementById('videoAula');
        var btn = document.getElementById('btnContainer');
        var msg = document.getElementById('msgAssista');
        var tracked25 = false, tracked50 = false, tracked75 = false, trackedComplete = false;

        video.addEventListener('play', function() {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({ event: 'curso_aula1_play', aula: '1' });
        }, { once: true });

        video.addEventListener('timeupdate', function() {
            if (!video.duration) return;
            var pct = (video.currentTime / video.duration) * 100;
            if (pct >= 25 && !tracked25) { tracked25 = true; window.dataLayer.push({ event: 'curso_aula1_25pct' }); }
            if (pct >= 50 && !tracked50) { tracked50 = true; window.dataLayer.push({ event: 'curso_aula1_50pct' }); }
            if (pct >= 75 && !tracked75) {
                tracked75 = true;
                window.dataLayer.push({ event: 'curso_aula1_75pct' });
                btn.classList.remove('hidden');
                msg.style.display = 'none';
            }
        });

        video.addEventListener('ended', function() {
            if (!trackedComplete) { trackedComplete = true; window.dataLayer.push({ event: 'curso_aula1_complete' }); }
            btn.classList.remove('hidden');
            msg.style.display = 'none';
        });

        document.getElementById('btnProximo').addEventListener('click', function() {
            window.dataLayer.push({ event: 'curso_aula1_proximo' });
        });
    })();
    </script>
