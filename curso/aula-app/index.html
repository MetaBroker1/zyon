<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Como Usar o App de IA | Zyon Capital</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../../images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../curso.css">

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-N2JXDKZW');</script>

    <style>
        .aviso-topo {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 28px;
            text-align: center;
        }

        .aviso-topo p {
            color: var(--color-gray-light);
            font-size: 14px;
            line-height: 1.5;
        }

        .aviso-topo .destaque {
            color: var(--color-green);
            font-weight: 600;
        }

        .btn-app {
            display: block;
            width: 100%;
            padding: 18px 24px;
            background: var(--color-green);
            color: var(--color-white);
            font-family: var(--font-family);
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            border-radius: var(--radius);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            position: relative;
        }

        .btn-app:hover {
            background: var(--color-green-dark);
            transform: translateY(-2px);
        }

        /* Estado discreto (antes de assistir) */
        .btn-app.discreto {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-gray);
            font-size: 14px;
            font-weight: 500;
            padding: 14px 20px;
            cursor: default;
            pointer-events: none;
        }

        .btn-app.discreto:hover {
            transform: none;
            box-shadow: none;
        }

        /* Estado ativo (após assistir) */
        .btn-app.ativo {
            pointer-events: auto;
            animation: pulsar 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.4);
        }

        .btn-app.ativo:hover {
            animation: none;
            box-shadow: 0 8px 32px rgba(0, 200, 83, 0.5);
        }

        @keyframes pulsar {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 200, 83, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 200, 83, 0.6);
                transform: scale(1.02);
            }
        }

        .btn-container-app {
            margin-top: 32px;
            margin-bottom: 16px;
        }

        .progresso-label {
            text-align: center;
            color: var(--color-gray);
            font-size: 13px;
            margin-top: 8px;
            transition: all 0.3s ease;
        }

        .progresso-label.concluido {
            color: var(--color-green);
            font-weight: 600;
        }

        .barra-progresso {
            width: 100%;
            height: 4px;
            background: var(--color-surface);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }

        .barra-progresso-fill {
            height: 100%;
            background: var(--color-green);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2JXDKZW"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <header class="curso-header">
        <img src="../../images/logo.png" alt="Zyon Capital" class="logo">
    </header>

    <main class="curso-container">
        <h1 class="curso-titulo">Como Usar o App de IA</h1>

        <div class="aviso-topo">
            <p>Assista a aula completa para <span class="destaque">liberar o acesso ao aplicativo</span></p>
        </div>

        <div class="video-wrapper">
            <video id="videoAula" controls playsinline preload="auto"
                   autoplay muted poster="../../images/logo.png">
                <source src="../aula-app-como-usar.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
        </div>

        <div class="barra-progresso">
            <div class="barra-progresso-fill" id="barraFill"></div>
        </div>

        <div class="btn-container-app">
            <a href="https://app.zyonai.app/minvest" class="btn-app discreto" id="btnApp">
                Acessar o Aplicativo
            </a>
            <p class="progresso-label" id="progressoLabel">Assista a aula para desbloquear</p>
        </div>
    </main>

    <footer class="curso-footer">
        <p>Zyon Capital</p>
    </footer>

    <script>
    (function() {
        var video = document.getElementById('videoAula');
        var btnApp = document.getElementById('btnApp');
        var barraFill = document.getElementById('barraFill');
        var progressoLabel = document.getElementById('progressoLabel');
        var tracked25 = false, tracked50 = false, tracked75 = false, trackedComplete = false;
        var desbloqueado = false;

        video.addEventListener('play', function() {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                event: 'curso_aula_app_play',
                aula: 'app',
                titulo: 'Como Usar o App de IA'
            });
        }, { once: true });

        video.addEventListener('timeupdate', function() {
            if (!video.duration) return;
            var pct = (video.currentTime / video.duration) * 100;

            // Atualizar barra de progresso
            barraFill.style.width = pct + '%';

            if (pct >= 25 && !tracked25) {
                tracked25 = true;
                window.dataLayer.push({ event: 'curso_aula_app_25pct' });
                progressoLabel.textContent = '25% concluído...';
            }
            if (pct >= 50 && !tracked50) {
                tracked50 = true;
                window.dataLayer.push({ event: 'curso_aula_app_50pct' });
                progressoLabel.textContent = '50% concluído...';
            }
            if (pct >= 75 && !tracked75) {
                tracked75 = true;
                window.dataLayer.push({ event: 'curso_aula_app_75pct' });
                progressoLabel.textContent = '75% concluído — quase lá!';
            }
            if (pct >= 95 && !desbloqueado) {
                desbloquear();
            }
        });

        video.addEventListener('ended', function() {
            if (!trackedComplete) {
                trackedComplete = true;
                window.dataLayer.push({ event: 'curso_aula_app_complete' });
            }
            desbloquear();
        });

        function desbloquear() {
            if (desbloqueado) return;
            desbloqueado = true;

            barraFill.style.width = '100%';
            btnApp.classList.remove('discreto');
            btnApp.classList.add('ativo');
            btnApp.textContent = 'Acessar o Aplicativo';
            progressoLabel.textContent = 'Acesso liberado!';
            progressoLabel.classList.add('concluido');

            // Scroll suave até o botão
            btnApp.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        btnApp.addEventListener('click', function(e) {
            if (!desbloqueado) {
                e.preventDefault();
                video.scrollIntoView({ behavior: 'smooth' });
                return;
            }
            window.dataLayer.push({ event: 'curso_aula_app_acesso_app' });
        });
    })();
    </script>
</body>
</html>
